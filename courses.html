<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cours par thématique</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="index.html">← Retour au menu</a></div><div class="card"><h1>Cours ECS — 1ère et 2ème année</h1><p class="muted">Cours organisés par thème avec difficulté croissante. Les définitions importantes, résultats et démonstrations clés sont mis en évidence.</p><div class="filters"><select id="yearFilter"><option value="">1A + 2A</option><option value="1A">1ère année</option><option value="2A">2ème année</option></select><select id="moduleFilter"><option value="">Tous les modules</option></select></div><div id="courseIndex" class="course-index"></div><div id="courses"></div></div></div><script src="assets/data.js"></script><script src="assets/courses-data.js"></script><script>function init(){[...new Set(ECS_COURSES.map(c=>c.module))].forEach(m=>moduleFilter.innerHTML+=`<option value="${m}">${m}</option>`);yearFilter.onchange=render;moduleFilter.onchange=render;render()}function render(){const items=ECS_COURSES.filter(c=>(!yearFilter.value||c.year===yearFilter.value)&&(!moduleFilter.value||c.module===moduleFilter.value)).sort((a,b)=>a.level-b.level);courseIndex.innerHTML=items.map(c=>`<a href="#course-${c.level}">${c.level}. ${c.theme}</a>`).join('');courses.innerHTML=items.map(c=>`<section class="course" id="course-${c.level}"><div class="course-head"><div><span class="pill gray">${c.year}</span><span class="pill">${c.module}</span><span class="pill green">Niveau ${c.level}</span><h2>${c.title}</h2></div></div><p>${c.intro}</p><h3>Définitions importantes</h3>${c.defs.map(x=>`<div class="def">${x}</div>`).join('')}<h3>Résultats à connaître</h3>${c.results.map(x=>`<div class="result">${x}</div>`).join('')}<h3>Démonstrations clés</h3>${c.demos.map(x=>`<div class="demo">${x}</div>`).join('')}<h3>Méthodes types</h3>${c.methods.map(x=>`<div class="method">${x}</div>`).join('')}</section>`).join('')}init()</script></body></html>
