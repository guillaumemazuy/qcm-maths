<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cours par thématique</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="index.html">← Retour au menu</a></div><div class="card"><h1>Cours ECS — 1ère et 2ème année</h1><p class="muted">Cours organisés par thème avec difficulté croissante. Clique sur un chapitre pour ouvrir sa sous-page détaillée.</p><div class="filters"><select id="yearFilter"><option value="">1A + 2A</option><option value="1A">1ère année</option><option value="2A">2ème année</option></select><select id="moduleFilter"><option value="">Tous les modules</option></select></div><div id="courseIndex" class="course-index"></div><div id="courses"></div></div></div><script src="assets/data.js"></script><script src="assets/courses-data.js"></script><script>const COURSE_SLUGS={1:'courses/1a-fondations-raisonnement.html',2:'courses/1a-algebre-polynomes.html',3:'courses/1a-analyse-suites.html',4:'courses/1a-analyse-fonctions.html',5:'courses/1a-analyse-dl.html',6:'courses/1a-algebre-espaces-vectoriels.html',7:'courses/1a-algebre-matrices-systemes.html',8:'courses/1a-probas-denombrement.html',9:'courses/1a-probas-finies.html',10:'courses/2a-analyse-series.html',11:'courses/2a-analyse-integrales-impropres.html',12:'courses/2a-algebre-applications-lineaires.html',13:'courses/2a-algebre-reduction.html',14:'courses/2a-probas-variables-discretes.html',15:'courses/2a-probas-variables-densite.html',16:'courses/2a-analyse-plusieurs-variables.html'};function init(){[...new Set(ECS_COURSES.map(c=>c.module))].forEach(m=>moduleFilter.innerHTML+=`<option value="${m}">${m}</option>`);yearFilter.onchange=render;moduleFilter.onchange=render;render()}function render(){const items=ECS_COURSES.filter(c=>(!yearFilter.value||c.year===yearFilter.value)&&(!moduleFilter.value||c.module===moduleFilter.value)).sort((a,b)=>a.level-b.level);courseIndex.innerHTML=items.map(c=>`<a href="${COURSE_SLUGS[c.level]||`course-detail.html?level=${c.level}`}">${c.level}. ${c.theme}</a>`).join('');courses.innerHTML=items.map(c=>`<a class="tile" href="${COURSE_SLUGS[c.level]||`course-detail.html?level=${c.level}`}"><span class="pill gray">${c.year}</span><span class="pill">${c.module}</span><span class="pill green">Niveau ${c.level}</span><h2>${c.title}</h2><p>${c.intro}</p></a>`).join('')}init()</script></body></html>
