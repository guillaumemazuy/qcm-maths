<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Back office — Questions</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><nav class="nav"><a href="index.html">Accueil</a><a href="qcm.html">QCM</a><a href="courses.html">Cours</a><a href="exam-questions.html">Épreuves</a><a href="admin-questions.html">Back questions</a><a href="admin-exams.html">Back concours</a></nav><div class="card"><h1>Back office — base de questions</h1><p class="muted">Ajoute des questions localement dans ton navigateur. Pour les rendre permanentes sur GitHub, il faudra ensuite les intégrer dans <code>assets/data.js</code>.</p><div class="two"><div><h2>Ajouter une question</h2><input id="theme" placeholder="Thème"><br><br><input id="level" placeholder="Niveau"><br><br><input id="question" placeholder="Question"><br><br><input id="a" placeholder="Réponse A"><br><br><input id="b" placeholder="Réponse B"><br><br><input id="c" placeholder="Réponse C"><br><br><input id="d" placeholder="Réponse D"><br><br><select id="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><br><br><textarea id="explanation" placeholder="Correction détaillée"></textarea><br><br><button class="btn" onclick="addQuestion()">Ajouter</button></div><div><h2>Questions enregistrées</h2><div id="list"></div></div></div></div></div><script src="assets/data.js"></script><script>function render(){const list=document.getElementById('list');const items=getAllQuestions();list.innerHTML=items.map((q,i)=>`<div class="admin-item"><span class="badge">${q.theme}</span><h3>${i+1}. ${q.question}</h3><p class="muted">Niveau : ${q.level||'-'} — Source : ${q.source||'base'}</p><p><strong>Réponse : ${q.answer}</strong></p><p>${q.explanation}</p></div>`).join('')}function addQuestion(){const item={id:'custom-'+Date.now(),theme:theme.value||'Divers',level:level.value||'moyen',source:'custom',question:question.value,options:[a.value,b.value,c.value,d.value],answer:answer.value,explanation:explanation.value||'Correction à compléter.'};if(!item.question||item.options.some(x=>!x)){alert('Complète la question et les 4 réponses.');return}const stored=getStoredQuestions();stored.push(item);saveStoredQuestions(stored);render();document.querySelectorAll('input,textarea').forEach(el=>el.value='')}render()</script></body></html>
