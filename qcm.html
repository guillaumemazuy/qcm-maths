<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>QCM</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="index.html">← Retour au menu</a></div><div class="card"><h1>QCM aléatoire</h1><p class="muted">30 questions aléatoires, correction immédiate au clic. La base inclut maintenant des questions générales et des questions générées depuis chaque cours.</p><div class="filters"><select id="themeFilter"><option value="">Tous les thèmes</option></select><select id="levelFilter"><option value="">Tous les niveaux</option><option value="moyen">Moyen</option><option value="difficile">Difficile</option><option value="concours">Concours</option></select></div><div class="score"><span id="scoreText">Score : 0 / 0</span><span id="answeredText">Répondues : 0 / 0</span><span id="percentText">0%</span></div><div class="row"><button class="btn" onclick="startNewTest()">Nouveau test</button><button class="btn secondary" onclick="resetQuiz()">Réinitialiser</button></div><form id="quizForm"></form></div></div><script src="assets/data.js"></script><script src="assets/qcm-extra.js"></script><script src="assets/courses-data.js"></script><script src="assets/courses-extra.js"></script><script src="assets/courses-extra-2.js"></script><script src="assets/qcm-by-course.js"></script><script>const TEST_SIZE=30;let questions=[];let userAnswers=[];const form=document.getElementById('quizForm');function initFilters(){getThemes().forEach(t=>themeFilter.innerHTML+=`<option value="${t}">${t}</option>`)}function pool(){return getAllQuestions().filter(q=>(!themeFilter.value||q.theme===themeFilter.value)&&(!levelFilter.value||q.level===levelFilter.value))}function startNewTest(){const p=pool();questions=shuffleArray(p).slice(0,Math.min(TEST_SIZE,p.length));userAnswers=new Array(questions.length).fill(null);renderQuiz();scrollTo({top:0,behavior:'smooth'})}function renderQuiz(){form.innerHTML=questions.map((q,index)=>`<div class="question" data-index="${index}" data-answer="${q.answer}"><span class="badge">${q.theme}</span><h2>${index+1}. ${q.question}</h2>${q.options.map((o,i)=>{const l=String.fromCharCode(65+i);return `<label class="option" data-value="${l}"><input type="radio" name="q${index+1}" value="${l}">${l}. ${o}</label>`}).join('')}<div class="correction"><strong></strong><div>${q.explanation}</div></div></div>`).join('');document.querySelectorAll("input[type='radio']").forEach(i=>i.addEventListener('change',answer));updateScore()}function answer(e){const block=e.target.closest('.question');const idx=+block.dataset.index;const selected=e.target.value;const correct=block.dataset.answer;userAnswers[idx]=selected;block.querySelectorAll('.option').forEach(label=>{label.classList.remove('correct','wrong');if(label.dataset.value===correct)label.classList.add('correct');if(label.dataset.value===selected&&selected!==correct)label.classList.add('wrong')});const corr=block.querySelector('.correction');const title=corr.querySelector('strong');corr.style.display='block';if(selected===correct){corr.className='correction good';title.textContent=`Bonne réponse : ${correct}`}else{corr.className='correction bad';title.textContent=`Mauvaise réponse. La bonne réponse était : ${correct}`}updateScore()}function updateScore(){let a=0,s=0;userAnswers.forEach((v,i)=>{if(v!==null){a++;if(v===questions[i].answer)s++}});const p=questions.length?Math.round(s/questions.length*100):0;scoreText.textContent=`Score : ${s} / ${questions.length}`;answeredText.textContent=`Répondues : ${a} / ${questions.length}`;percentText.textContent=`${p}%`}function resetQuiz(){userAnswers=new Array(questions.length).fill(null);renderQuiz()}initFilters();themeFilter.onchange=startNewTest;levelFilter.onchange=startNewTest;startNewTest()</script></body></html>
