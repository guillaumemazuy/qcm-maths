<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QCM Mathématiques Prépa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; font-family: Arial, sans-serif;
      background: #f3f4f6; color: #111827; line-height: 1.6;
    }
    .container {
      max-width: 1050px; margin: auto; background: white; padding: 28px;
      border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { text-align: center; margin-bottom: 8px; font-size: 28px; }
    .subtitle { text-align: center; color: #6b7280; margin-bottom: 24px; }
    .score-box {
      position: sticky; top: 10px; z-index: 10; background: #111827; color: white;
      padding: 14px 18px; border-radius: 14px; margin-bottom: 18px; font-weight: bold;
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .button-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    button {
      flex: 1; padding: 13px 14px; border: none; border-radius: 12px;
      background: #111827; color: white; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #374151; }
    .secondary { background: #4b5563; }
    .question {
      border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px;
      margin-bottom: 18px; background: #fafafa;
    }
    .question h2 { margin-top: 0; font-size: 18px; line-height: 1.45; }
    .theme {
      display: inline-block; margin-bottom: 8px; padding: 4px 9px; border-radius: 999px;
      background: #eef2ff; color: #3730a3; font-size: 12px; font-weight: bold;
    }
    .option {
      display: block; background: white; margin: 8px 0; padding: 11px 13px;
      border-radius: 10px; border: 1px solid #e5e7eb; cursor: pointer;
    }
    .option:hover { background: #f3f4f6; }
    .option input { margin-right: 8px; }
    .option.correct-choice { border-color: #10b981; background: #ecfdf5; color: #065f46; font-weight: bold; }
    .option.wrong-choice { border-color: #ef4444; background: #fef2f2; color: #991b1b; font-weight: bold; }
    .correction { display: none; margin-top: 14px; padding: 14px; border-radius: 10px; font-size: 14px; }
    .correction.correct { background: #ecfdf5; border-left: 5px solid #10b981; color: #065f46; }
    .correction.wrong { background: #fef2f2; border-left: 5px solid #ef4444; color: #7f1d1d; }
    .correction strong { display: block; margin-bottom: 6px; font-size: 15px; }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .container { padding: 16px; }
      h1 { font-size: 22px; }
      .score-box { font-size: 14px; }
      .button-row { flex-direction: column; }
      .question { padding: 14px; }
      .question h2 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QCM Mathématiques — Prépa</h1>
    <p class="subtitle">30 questions tirées aléatoirement dans une base difficile — correction immédiate au clic</p>
    <div class="score-box">
      <span id="scoreText">Score : 0 / 30</span>
      <span id="answeredText">Répondues : 0 / 30</span>
      <span id="percentText">0%</span>
    </div>
    <div class="button-row">
      <button type="button" onclick="startNewTest()">Nouveau test aléatoire</button>
      <button type="button" class="secondary" onclick="resetQuiz()">Réinitialiser ce test</button>
    </div>
    <form id="quizForm"></form>
  </div>

  <script>
    const TEST_SIZE = 30;

    const questionBank = [
      {
        theme: "Analyse — équivalents",

      },
      {
        theme: "Analyse — développements limités",
        question: "Quelle est la limite de (ln(1+x)-x+x²/2-x³/3)/x⁴ lorsque x tend vers 0 ?",

      },
      {
        theme: "Analyse — équivalents",

      },
      {
        theme: "Analyse — équivalents",

      },
      {
        theme: "Analyse — intégrales impropres",

      {

        question: "Quel est le rayon de convergence de Σ n²x^n ?",
        options: ["0", "1", "2", "+∞"],

        explanation: "Le facteur polynomial n² ne modifie pas le rayon de Σx^n. Le rayon vaut 1."
      },
      {
        theme: "Séries entières",
        question: "Quel est le rayon de convergence de Σ n! x^n ?",
        options: ["0", "1", "e", "+∞"],

      {
        theme: "Algèbre linéaire — noyau image",

      {
        theme: "Algèbre linéaire — projecteurs",
        question: "Une application linéaire p est un projecteur si et seulement si :",

        explanation: "Un projecteur vérifie p∘p=p : projeter une deuxième fois ne change plus rien."
      },
      {
        theme: "Algèbre linéaire — symétries",
        question: "Une application linéaire s est une symétrie si elle vérifie :",

        explanation: "Une symétrie est une involution : appliquer deux fois s redonne l’identité."

      {
        theme: "Algèbre linéaire — diagonalisation",
        question: "Une matrice diagonalisable de taille n possède :",

        question: "Si A²=0, alors A est :",

        answer: "C",
        explanation: "Chaque ligne est multipliée par λ. Il y a n lignes, donc le déterminant est multiplié par λ^n."
      },
      {
        theme: "Matrices — inverse",
        question: "Si A est inversible et λ est valeur propre de A, alors une valeur propre de A^{-1} est :",
        options: ["λ", "-λ", "1/λ", "λ²"],
        answer: "C",
        explanation: "Si Av=λv, alors A^{-1}v=(1/λ)v. Il faut λ≠0, garanti par l’inversibilité."
      },
      {
        theme: "Matrices — diagonalisation",
        question: "Si A est diagonalisable avec valeurs propres 2 et -1, les valeurs propres de A² sont :",

        explanation: "Les valeurs propres de A² sont les carrés des valeurs propres de A : 4 et 1."

        theme: "Matrices — orthogonalité",
        question: "Une matrice orthogonale Q vérifie :",

        answer: "A",
        explanation: "Les colonnes de Q forment une base orthonormée, ce qui équivaut à QᵀQ=I."
      },

      {

      },
      {

        theme: "Polynômes",
        question: "Si a est racine double de P, alors :",

      },

    let questions = [];
    let userAnswers = [];
    const form = document.getElementById("quizForm");

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startNewTest() {
      questions = shuffleArray(questionBank).slice(0, Math.min(TEST_SIZE, questionBank.length));
      userAnswers = new Array(questions.length).fill(null);
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuiz() {
      form.innerHTML = "";
      questions.forEach((q, index) => {
        const qNumber = index + 1;
        const block = document.createElement("div");
        block.className = "question";
        block.dataset.index = index;
        block.dataset.answer = q.answer;

        block.innerHTML = `
          <span class="theme">${q.theme}</span>
          <h2>${qNumber}. ${q.question}</h2>
          ${q.options.map((option, i) => {
            const letter = String.fromCharCode(65 + i);
            return `
              <label class="option" data-value="${letter}">
                <input type="radio" name="q${qNumber}" value="${letter}">
                ${letter}. ${option}
              </label>
            `;
          }).join("")}
          <div class="correction">
            <strong></strong>
            <div>${q.explanation}</div>
          </div>
        `;

        form.appendChild(block);
      });

      document.querySelectorAll("input[type='radio']").forEach(input => {
        input.addEventListener("change", handleAnswerClick);
      });

      updateScore();
    }

    function handleAnswerClick(event) {
      const input = event.target;
      const questionBlock = input.closest(".question");
      const index = Number(questionBlock.dataset.index);
      const selectedAnswer = input.value;
      const correctAnswer = questionBlock.dataset.answer;

      userAnswers[index] = selectedAnswer;

      const labels = questionBlock.querySelectorAll(".option");
      const correction = questionBlock.querySelector(".correction");
      const correctionTitle = correction.querySelector("strong");

      labels.forEach(label => {
        label.classList.remove("correct-choice", "wrong-choice");

        if (label.dataset.value === correctAnswer) {
          label.classList.add("correct-choice");
        }

        if (label.dataset.value === selectedAnswer && selectedAnswer !== correctAnswer) {
          label.classList.add("wrong-choice");
        }
      });

      correction.style.display = "block";

      if (selectedAnswer === correctAnswer) {
        correction.className = "correction correct";
        correctionTitle.textContent = `Bonne réponse : ${correctAnswer}`;
      } else {
        correction.className = "correction wrong";
        correctionTitle.textContent = `Mauvaise réponse. La bonne réponse était : ${correctAnswer}`;
      }

      updateScore();
    }

    function updateScore() {
      let answered = 0;
      let score = 0;

      userAnswers.forEach((answer, index) => {
        if (answer !== null) {
          answered++;
          if (answer === questions[index].answer) score++;
        }
      });

      const percent = questions.length === 0 ? 0 : Math.round((score / questions.length) * 100);

      document.getElementById("scoreText").textContent = `Score : ${score} / ${questions.length}`;
      document.getElementById("answeredText").textContent = `Répondues : ${answered} / ${questions.length}`;
      document.getElementById("percentText").textContent = `${percent}%`;
    }

    function resetQuiz() {
      userAnswers = new Array(questions.length).fill(null);
      renderQuiz();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    startNewTest();
  </script>
</body>
