<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cours détaillé</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="courses.html">← Retour aux cours</a> <a class="back-menu" href="index.html">Menu</a></div><main id="page" class="card"></main></div><script src="assets/courses-data.js"></script><script>function getLevel(){return Number(new URLSearchParams(location.search).get('level'))}function block(title,items,cls){return `<h3>${title}</h3>${items.map(x=>`<div class="${cls}">${x}</div>`).join('')}`}function render(){const course=ECS_COURSES.find(c=>c.level===getLevel())||ECS_COURSES[0];document.title=course.title;page.innerHTML=`<div class="course-head"><div><span class="pill gray">${course.year}</span><span class="pill">${course.module}</span><span class="pill green">Niveau ${course.level}</span><h1>${course.title}</h1><p class="muted">${course.theme}</p></div></div><p>${course.intro}</p><div class="row"><a class="btn" href="qcm.html">S'entraîner en QCM</a><a class="btn secondary" href="exam-questions.html">Questions type épreuves</a></div>${block('Définitions importantes',course.defs,'def')}${block('Résultats à connaître',course.results,'result')}${block('Démonstrations clés',course.demos,'demo')}${block('Méthodes types',course.methods,'method')}<section class="course"><h2>Plan de travail conseillé</h2><ol><li>Relire les définitions jusqu’à pouvoir les réciter sans ambiguïté.</li><li>Refaire les démonstrations clés sans regarder la correction.</li><li>Transformer chaque résultat en question de QCM ou en mini-exercice.</li><li>Passer ensuite aux questions type concours du même thème.</li></ol></section>`}render()</script></body></html>
