<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Back office — Concours</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><nav class="nav"><a href="index.html">Accueil</a><a href="qcm.html">QCM</a><a href="courses.html">Cours</a><a href="exam-questions.html">Épreuves</a><a href="admin-questions.html">Back questions</a><a href="admin-exams.html">Back concours</a></nav><div class="card"><h1>Back office — exemples concours</h1><p class="muted">Cette page liste les questions marquées <code>source: concours</code>. Les exemples sont inspirés de formats classiques d’épreuves/oraux, sans reproduction officielle.</p><div id="list"></div></div></div><script src="assets/data.js"></script><script>const list=document.getElementById('list');const exams=getAllQuestions().filter(q=>q.source==='concours');list.innerHTML=exams.map((q,i)=>`<div class="exam"><span class="badge">${q.exam||'Concours'}</span><h2>${i+1}. ${q.question}</h2><p class="muted">Thème : ${q.theme} — Niveau : ${q.level}</p><p><strong>Réponse : ${q.answer}</strong></p><p>${q.explanation}</p></div>`).join('')||'<p>Aucun exemple concours pour le moment.</p>'</script></body></html>
