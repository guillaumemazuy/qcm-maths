<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exercices type concours</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="index.html">← Retour au menu</a></div><div class="card"><h1>Exercices type concours</h1><p class="muted">Base structurée par thème et niveau. Les exercices sont originaux, inspirés des formats concours, et non des reproductions d’annales.</p><div class="filters"><select id="themeFilter"><option value="">Tous les thèmes</option></select><select id="difficultyFilter"><option value="">Tous les niveaux</option><option value="progressif">Progressif</option><option value="intermédiaire">Intermédiaire</option><option value="concours">Concours</option></select></div><div id="list"></div></div></div><script src="assets/courses-data.js"></script><script src="assets/courses-extra.js"></script><script src="assets/courses-extra-2.js"></script><script src="assets/exam-exercises.js"></script><script src="assets/exam-exercises-analysis.js"></script><script>function init(){[...new Set(EXAM_EXERCISES.map(e=>e.theme))].forEach(t=>themeFilter.innerHTML+=`<option value="${t}">${t}</option>`);themeFilter.onchange=render;difficultyFilter.onchange=render;render()}function render(){const items=EXAM_EXERCISES.filter(e=>(!themeFilter.value||e.theme===themeFilter.value)&&(!difficultyFilter.value||e.difficulty===difficultyFilter.value)).sort((a,b)=>a.level-b.level);list.innerHTML=items.map(group=>`<section class="exam"><span class="pill gray">${group.year}</span><span class="pill">${group.module}</span><span class="pill green">${group.difficulty}</span><h2>${group.level}. ${group.theme}</h2>${group.exercises.map((ex,i)=>`<div class="method"><strong>Exercice ${i+1} — ${ex.title}</strong><p>${ex.statement}</p><details><summary>Voir la correction / méthode</summary><p>${ex.solution}</p></details></div>`).join('')}</section>`).join('')||'<p>Aucun exercice trouvé.</p>'}init()</script></body></html>
