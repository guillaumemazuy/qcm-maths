<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Questions type épreuves</title><link rel="stylesheet" href="assets/styles.css"></head><body><div class="wrap"><div class="back-row"><a class="back-menu" href="index.html">← Retour au menu</a></div><div class="card"><h1>Questions type épreuves</h1><p class="muted">Questions inspirées de formats concours. Correction affichée question par question.</p><div id="list"></div></div></div><script src="assets/data.js"></script><script>const questions=getAllQuestions().filter(q=>q.source==='concours');const list=document.getElementById('list');list.innerHTML=questions.map((q,index)=>`<div class="question" data-answer="${q.answer}"><span class="badge">${q.exam||q.theme}</span><h2>${index+1}. ${q.question}</h2>${q.options.map((o,i)=>{const l=String.fromCharCode(65+i);return `<label class="option" data-value="${l}"><input type="radio" name="q${index}" value="${l}">${l}. ${o}</label>`}).join('')}<div class="correction"><strong></strong><div>${q.explanation}</div></div></div>`).join('')||'<p>Aucune question concours.</p>';document.querySelectorAll("input[type='radio']").forEach(input=>input.addEventListener('change',e=>{const block=e.target.closest('.question');const correct=block.dataset.answer;const selected=e.target.value;block.querySelectorAll('.option').forEach(label=>{label.classList.remove('correct','wrong');if(label.dataset.value===correct)label.classList.add('correct');if(label.dataset.value===selected&&selected!==correct)label.classList.add('wrong')});const corr=block.querySelector('.correction');corr.style.display='block';corr.className=selected===correct?'correction good':'correction bad';corr.querySelector('strong').textContent=selected===correct?`Bonne réponse : ${correct}`:`Mauvaise réponse. La bonne réponse était : ${correct}`}))</script></body></html>
